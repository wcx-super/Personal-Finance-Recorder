<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/auth.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Log in</h1>
  <form id="auth-form" class="add-form" data-endpoint="/login">
    <div class="full">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required maxlength="254" autocomplete="email">
    </div>
    <div class="full">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <p id="form-error" class="error-detail full" hidden></p>
    <div class="full">
      <button type="submit">Log in</button>
    </div>
  </form>
  <p>No account yet? <a href="/register.html">Sign up</a></p>
</div>
</body>
</html>
